[package]
name = "incident-reporting"
version = "0.1.0"
description = "Incident reporting desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.77"
# The update-check widget polls the GitHub releases API for this repo.
repository = "https://github.com/alex-poor/jexcel"

[lib]
name = "incident_reporting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.30"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "incident-reporting"
path = "src/main.rs"

[[bin]]
name = "ingest-cli"
path = "src/bin/ingest_cli.rs"
